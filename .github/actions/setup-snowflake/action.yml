name: Setup Snowflake Connection
description: Authenticate via OIDC workload identity or SNOW_CONFIG_B64 fallback
inputs:
  use-oidc:
    description: 'Use OIDC workload identity federation (requires id-token: write permission)'
    required: false
    default: 'true'
  snowflake-account:
    description: 'Snowflake account identifier'
    required: false
    default: 'zs28104.eu-central-1'
  snowflake-user:
    description: 'Snowflake user for OIDC auth'
    required: false
    default: 'SVC_CICD'
  snowflake-role:
    description: 'Snowflake role'
    required: false
    default: 'CICD'
  snowflake-warehouse:
    description: 'Snowflake warehouse'
    required: false
    default: 'MD_TEST_WH'
  snow-config-b64:
    description: 'Base64-encoded config.toml (fallback when OIDC disabled)'
    required: false
    default: ''
outputs:
  connection-name:
    description: 'Snowflake connection name to use with -c flag'
    value: ${{ steps.auth.outputs.connection_name }}
runs:
  using: composite
  steps:
    - id: auth
      shell: bash
      run: |
        set -Eeuo pipefail
        if [[ "${{ inputs.use-oidc }}" == "true" ]]; then
          echo "Configuring OIDC workload identity..."
          echo "SNOWFLAKE_ACCOUNT=${{ inputs.snowflake-account }}" >> $GITHUB_ENV
          echo "SNOWFLAKE_USER=${{ inputs.snowflake-user }}" >> $GITHUB_ENV
          echo "SNOWFLAKE_ROLE=${{ inputs.snowflake-role }}" >> $GITHUB_ENV
          echo "SNOWFLAKE_WAREHOUSE=${{ inputs.snowflake-warehouse }}" >> $GITHUB_ENV
          echo "SNOWFLAKE_AUTHENTICATOR=WORKLOAD_IDENTITY" >> $GITHUB_ENV
          echo "SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER=OIDC" >> $GITHUB_ENV
          echo "SNOWFLAKE_AUDIENCE=snowflakecomputing.com" >> $GITHUB_ENV
          echo "connection_name=default" >> $GITHUB_OUTPUT
          echo "CONNECTION_NAME=default" >> $GITHUB_ENV
        elif [[ -n "${{ inputs.snow-config-b64 }}" ]]; then
          echo "Configuring via SNOW_CONFIG_B64 fallback..."
          export SNOW_CONFIG_B64="${{ inputs.snow-config-b64 }}"
          bash /usr/local/bin/github-runner_v1.sh
          CONNECTION_NAME=$(grep -oP '^\[connections\.\K[^\]]+' $HOME/.snowflake/config.toml | head -1)
          echo "connection_name=$CONNECTION_NAME" >> $GITHUB_OUTPUT
          echo "CONNECTION_NAME=$CONNECTION_NAME" >> $GITHUB_ENV
        else
          echo "::error::No authentication method available. Set use-oidc: true or provide snow-config-b64."
          exit 1
        fi
        if [[ -f "$HOME/.sonar_env" ]]; then
          grep '^SONAR_' "$HOME/.sonar_env" >> $GITHUB_ENV || true
        fi
